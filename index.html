<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="container">
      <h1 class="game-title">Tic Tac Toe</h1>

      <!-- Game Mode Selector -->
      <div class="mode-selector" id="mode-selector">
        <button class="mode-btn active" data-mode="pvp">
          <span class="mode-icon">👥</span>
          <span class="mode-text">2 Players</span>
        </button>
        <button class="mode-btn" data-mode="ai">
          <span class="mode-icon">🤖</span>
          <span class="mode-text">vs AI</span>
        </button>
      </div>

      <!-- AI Difficulty (shown only in AI mode) -->
      <div class="difficulty-selector hidden" id="difficulty-selector">
        <button class="diff-btn" data-difficulty="easy">Easy</button>
        <button class="diff-btn active" data-difficulty="medium">Medium</button>
        <button class="diff-btn" data-difficulty="hard">Hard</button>
        <button class="diff-btn impossible" data-difficulty="impossible">
          😈 Impossible
        </button>
      </div>

      <div class="score-board">
        <div class="score-box player-x">
          <span class="player-name">Player X</span>
          <span class="score" id="score-x">0</span>
        </div>
        <div class="score-box player-o">
          <span class="player-name">Player O</span>
          <span class="score" id="score-o">0</span>
        </div>
      </div>

      <div
        class="game-status"
        id="game-status"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      >
        Turn: X
      </div>

      <div
        class="game-grid"
        id="game-grid"
        role="grid"
        aria-label="Tic Tac Toe Game Grid"
      >
        <div class="grid-row" role="row">
          <button class="cell" data-index="0" role="gridcell" aria-label="Cell 1, empty"></button>
          <button class="cell" data-index="1" role="gridcell" aria-label="Cell 2, empty"></button>
          <button class="cell" data-index="2" role="gridcell" aria-label="Cell 3, empty"></button>
        </div>
        <div class="grid-row" role="row">
          <button class="cell" data-index="3" role="gridcell" aria-label="Cell 4, empty"></button>
          <button class="cell" data-index="4" role="gridcell" aria-label="Cell 5, empty"></button>
          <button class="cell" data-index="5" role="gridcell" aria-label="Cell 6, empty"></button>
        </div>
        <div class="grid-row" role="row">
          <button class="cell" data-index="6" role="gridcell" aria-label="Cell 7, empty"></button>
          <button class="cell" data-index="7" role="gridcell" aria-label="Cell 8, empty"></button>
          <button class="cell" data-index="8" role="gridcell" aria-label="Cell 9, empty"></button>
        </div>
      </div>

      <button id="restart-btn" class="btn-restart">Restart Game</button>
    </main>

    <!-- Footer -->
    <footer class="sign">
      Created by
      <a
        href="https://serkanbayraktar.com/"
        target="_blank"
        rel="noopener noreferrer"
        >Serkanby</a
      >
      |
      <a
        href="https://github.com/Serkanbyx"
        target="_blank"
        rel="noopener noreferrer"
        >Github</a
      >
    </footer>

    <script src="js/script.js"></script>
  </body>
</html>
